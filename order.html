<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0908"><title>Parade — Ingredient Reorder</title>
<style>
:root{--bg:#0b0908;--panel:#171310;--panel2:#211a16;--text:#f7efe8;--muted:#aa9b90;--brand:#bb705e;--gold:#ddb775;--line:#342923;--green:#75bd86;--red:#e8796f;--shadow:0 18px 55px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#382018 0,#100c0a 34rem,#080706 70rem);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(1220px,calc(100% - 28px));margin:auto}header{padding:32px 0 22px}.brand{font:700 clamp(2.5rem,7vw,5rem)/.9 Georgia,serif;letter-spacing:.18em;color:#ca806f}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.16em;font-weight:800;font-size:.78rem;margin-bottom:10px}.intro{max-width:760px;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:20;background:rgba(10,8,7,.92);backdrop-filter:blur(18px);border-block:1px solid var(--line)}.tools,.tags{display:flex;gap:8px;align-items:center;padding:10px 0;overflow:auto}.search{flex:1;min-width:220px}input,button{font:inherit}.search input,.field input{width:100%;background:#120f0d;border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text)}.search input{border-radius:999px}.chip,.btn,.tagfilter{border:1px solid var(--line);background:#181310;color:#dacbc1;border-radius:999px;padding:10px 13px;cursor:pointer;white-space:nowrap;font-weight:800}.chip.active,.tagfilter.active,.chip:hover,.tagfilter:hover,.btn:hover{background:var(--brand);border-color:var(--brand);color:#fff}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}.stat,.card,.top-card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:15px}.stat small{color:var(--muted);text-transform:uppercase;font-weight:800;font-size:.72rem}.stat strong{display:block;font-size:1.7rem}main{padding-bottom:60px}.section{margin-bottom:34px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}h2{margin:0;font:700 clamp(1.3rem,3vw,1.8rem) Georgia,serif;letter-spacing:.05em}.meta{color:var(--muted);font-size:.85rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.top-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.top-card{padding:14px}.top-card b{display:block;font-family:Georgia,serif}.top-card span{color:var(--gold);font-weight:900}.card{padding:15px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#654a3d}.card.checked{opacity:.58}.card.reorder{border-color:rgba(232,121,111,.7)}.line{display:flex;gap:10px;align-items:flex-start}.check{appearance:none;width:24px;height:24px;border:2px solid #68534a;border-radius:7px;flex:none}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';display:grid;place-items:center;color:#071108;font-weight:900}.item{flex:1;min-width:0}.name{font:700 1.12rem Georgia,serif}.tag{display:inline-block;margin-top:7px;background:#30251f;border-radius:999px;padding:5px 8px;font-size:.72rem;font-weight:900}.count{color:#ffd797;background:rgba(221,183,117,.12);border:1px solid rgba(221,183,117,.3);border-radius:999px;padding:5px 8px;font-size:.72rem;font-weight:900;white-space:nowrap}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.field label{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;font-weight:800;margin-bottom:4px}.orderBtn{width:100%;margin-top:11px;border:1px solid rgba(221,183,117,.38);background:#2b2018;color:#ffe0a5;border-radius:11px;padding:12px;font-weight:900;cursor:pointer}.orderBtn:hover{background:var(--brand);color:#fff}.status{display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:.8rem}.status label{font-weight:800}.status input{accent-color:var(--red)}.saved{color:var(--muted);text-align:right}.empty{display:none;text-align:center;color:var(--muted);padding:40px}footer{text-align:center;color:#7f7168;padding:0 0 35px}@media(max-width:1000px){.top-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.tools{flex-wrap:wrap}.search{flex-basis:100%}.grid{grid-template-columns:1fr}.top-grid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:1fr 1fr}}@media print{.toolbar,.orderBtn,.status label{display:none!important}body{background:#fff;color:#111}.card,.top-card,.stat{box-shadow:none;background:#fff;color:#111}}
</style></head><body>
<header class="wrap"><div class="eyebrow">Kitchen stock control</div><div class="brand">PARADE</div></header>
<nav class="toolbar"><div class="wrap tools"><div class="search"><input id="search" type="search" placeholder="Search ingredients or tags…"></div><button class="chip active" data-view="all">All</button><button class="chip" data-view="reorder">Needs reorder</button><button class="chip" data-view="unchecked">Not checked</button><button class="btn" id="print">Print</button><button class="btn" id="csv">Export CSV</button><button class="btn" id="reset">Reset today</button></div><div class="wrap tags" id="tags"></div></nav>
<div class="wrap summary"><div class="stat"><small>Ingredients</small><strong id="total">0</strong></div><div class="stat"><small>Checked</small><strong id="checked">0</strong></div><div class="stat"><small>Need reorder</small><strong id="need">0</strong></div><div class="stat"><small>Progress</small><strong id="progress">0%</strong></div><div class="stat"><small>Lifetime orders</small><strong id="orders">0</strong></div></div>
<main class="wrap"><section class="section" id="topSec"><div class="head"><div></div></div><div class="top-grid" id="top"></div></section><div id="app"></div></main><div class="wrap empty" id="empty">No ingredients match this view.</div><footer class="wrap">Reset today clears today's stock check only. Lifetime order counts are kept.</footer>
<script>
const inventory=[
{f:'daily',n:'Eggs',c:'Dairy & chilled',u:'trays',p:4},{f:'daily',n:'Fresh milk',c:'Dairy & chilled',u:'bottles',p:6},{f:'daily',n:'Cream',c:'Dairy & chilled',u:'cartons',p:2},{f:'daily',n:'Chicken breast',c:'Meat',u:'kg',p:5},{f:'daily',n:'Smoked salmon',c:'Fish',u:'packs',p:3},{f:'daily',n:'Salmon fillets',c:'Fish',u:'portions',p:8},{f:'daily',n:'Sea bass',c:'Fish',u:'portions',p:8},{f:'daily',n:'King prawns',c:'Fish',u:'kg',p:2},{f:'daily',n:'Avocado',c:'Fresh produce',u:'pieces',p:12},{f:'daily',n:'Tomatoes',c:'Fresh produce',u:'kg',p:4},{f:'daily',n:'Cherry tomatoes',c:'Fresh produce',u:'punnets',p:3},{f:'daily',n:'Cucumber',c:'Fresh produce',u:'pieces',p:8},{f:'daily',n:'Mixed salad leaves',c:'Fresh produce',u:'bags',p:5},{f:'daily',n:'Rocket',c:'Fresh produce',u:'bags',p:3},{f:'daily',n:'Spinach',c:'Fresh produce',u:'bags',p:3},{f:'daily',n:'Mushrooms',c:'Fresh produce',u:'kg',p:3},{f:'daily',n:'Fresh bread & toast loaves',c:'Bakery',u:'loaves',p:6},{f:'daily',n:'English muffins',c:'Bakery',u:'packs',p:3},{f:'daily',n:'Baguettes / panini bread',c:'Bakery',u:'pieces',p:15},{f:'daily',n:'Sourdough bread',c:'Bakery',u:'loaves',p:3},{f:'daily',n:'Fresh fruit selection',c:'Fresh produce',u:'trays',p:2},
{f:'2-3-days',n:'Bacon',c:'Meat',u:'packs',p:5},{f:'2-3-days',n:'Cumberland sausages',c:'Meat',u:'packs',p:4},{f:'2-3-days',n:'Chicken sausages',c:'Meat',u:'packs',p:3},{f:'2-3-days',n:'Turkey rashers',c:'Meat',u:'packs',p:3},{f:'2-3-days',n:'Ham',c:'Meat',u:'packs',p:4},{f:'2-3-days',n:'Minced beef',c:'Meat',u:'kg',p:4},{f:'2-3-days',n:'Steak / rib-eye',c:'Meat',u:'kg',p:3},{f:'2-3-days',n:'Lamb chops',c:'Meat',u:'kg',p:3},{f:'2-3-days',n:'Lamb shish / kofte',c:'Meat',u:'kg',p:4},{f:'2-3-days',n:'Halloumi',c:'Dairy & chilled',u:'blocks',p:6},{f:'2-3-days',n:'Feta cheese',c:'Dairy & chilled',u:'blocks',p:4},{f:'2-3-days',n:'Mozzarella',c:'Dairy & chilled',u:'packs',p:4},{f:'2-3-days',n:'Cheddar cheese',c:'Dairy & chilled',u:'blocks',p:3},{f:'2-3-days',n:'Parmesan',c:'Dairy & chilled',u:'packs',p:2},{f:'2-3-days',n:'Butter',c:'Dairy & chilled',u:'blocks',p:5},{f:'2-3-days',n:'Lettuce / baby gem',c:'Fresh produce',u:'heads',p:8},{f:'2-3-days',n:'Bell peppers',c:'Fresh produce',u:'kg',p:2},{f:'2-3-days',n:'Red onions',c:'Fresh produce',u:'kg',p:2},{f:'2-3-days',n:'White onions',c:'Fresh produce',u:'kg',p:3},{f:'2-3-days',n:'New potatoes',c:'Fresh produce',u:'kg',p:5},{f:'2-3-days',n:'Baking potatoes',c:'Fresh produce',u:'sacks',p:1},{f:'2-3-days',n:'Seasonal vegetables',c:'Fresh produce',u:'crates',p:2},{f:'2-3-days',n:'Lemons',c:'Fresh produce',u:'pieces',p:12},{f:'2-3-days',n:'Fresh herbs',c:'Fresh produce',u:'bunches',p:5},
{f:'weekly',n:'Hash browns',c:'Frozen',u:'bags',p:4},{f:'weekly',n:'Chips / fries',c:'Frozen',u:'bags',p:8},{f:'weekly',n:'Scampi',c:'Frozen',u:'bags',p:3},{f:'weekly',n:'Fish fingers',c:'Frozen',u:'boxes',p:2},{f:'weekly',n:'Chicken nuggets',c:'Frozen',u:'bags',p:3},{f:'weekly',n:'Falafel',c:'Frozen / chilled',u:'packs',p:4},{f:'weekly',n:'Puff pastry',c:'Frozen / chilled',u:'packs',p:2},{f:'weekly',n:'Baked beans',c:'Tins & jars',u:'tins',p:24},{f:'weekly',n:'Tuna',c:'Tins & jars',u:'tins',p:18},{f:'weekly',n:'Sweetcorn',c:'Tins & jars',u:'tins',p:12},{f:'weekly',n:'Kidney beans',c:'Tins & jars',u:'tins',p:12},{f:'weekly',n:'Olives',c:'Tins & jars',u:'jars',p:3},{f:'weekly',n:'Sun-dried tomatoes',c:'Tins & jars',u:'jars',p:3},{f:'weekly',n:'Hummus',c:'Dips & sauces',u:'tubs',p:4},{f:'weekly',n:'Mayonnaise',c:'Dips & sauces',u:'tubs',p:3},{f:'weekly',n:'Hollandaise sauce',c:'Dips & sauces',u:'cartons',p:3},{f:'weekly',n:'Ketchup',c:'Dips & sauces',u:'bottles',p:3},{f:'weekly',n:'Burger sauce',c:'Dips & sauces',u:'bottles',p:2},{f:'weekly',n:'Sweet chilli sauce',c:'Dips & sauces',u:'bottles',p:2},{f:'weekly',n:'Tartar sauce',c:'Dips & sauces',u:'bottles',p:2},{f:'weekly',n:'Pesto',c:'Dips & sauces',u:'jars',p:2},{f:'weekly',n:'Pomegranate sauce / glaze',c:'Dips & sauces',u:'bottles',p:2},{f:'weekly',n:'Balsamic glaze',c:'Dips & sauces',u:'bottles',p:2},{f:'weekly',n:'Chef salad dressing',c:'Dips & sauces',u:'bottles',p:2},{f:'weekly',n:'Rice',c:'Dry goods',u:'bags',p:3},{f:'weekly',n:'Couscous',c:'Dry goods',u:'bags',p:2},{f:'weekly',n:'Spaghetti',c:'Dry goods',u:'packs',p:8},{f:'weekly',n:'Penne pasta',c:'Dry goods',u:'packs',p:8},{f:'weekly',n:'Lasagne sheets',c:'Dry goods',u:'packs',p:4},{f:'weekly',n:'Burger buns',c:'Bakery / frozen',u:'packs',p:4},{f:'weekly',n:'Pitta bread',c:'Bakery / frozen',u:'packs',p:4},{f:'weekly',n:'Pancakes',c:'Bakery / frozen',u:'packs',p:3},
{f:'fortnightly',n:'Cooking oil',c:'Dry store',u:'tins',p:2},{f:'fortnightly',n:'Flour',c:'Dry store',u:'bags',p:2},{f:'fortnightly',n:'Sugar',c:'Dry store',u:'bags',p:2},{f:'fortnightly',n:'Salt',c:'Dry store',u:'packs',p:2},{f:'fortnightly',n:'Black pepper',c:'Dry store',u:'packs',p:2},{f:'fortnightly',n:'Mixed herbs & spices',c:'Dry store',u:'packs',p:3},{f:'fortnightly',n:'Gravy granules',c:'Dry store',u:'tubs',p:2},{f:'fortnightly',n:'Tomato sauce / passata',c:'Dry store',u:'tins',p:12},{f:'fortnightly',n:'Jam',c:'Dry store',u:'jars',p:3},{f:'fortnightly',n:'Maple syrup',c:'Dry store',u:'bottles',p:2},{f:'fortnightly',n:'Cinnamon',c:'Dry store',u:'packs',p:1},{f:'fortnightly',n:'Croutons',c:'Dry store',u:'bags',p:3},{f:'fortnightly',n:'Walnuts',c:'Dry store',u:'bags',p:2},{f:'fortnightly',n:'Piccalilli',c:'Tins & jars',u:'jars',p:2},{f:'fortnightly',n:'Coleslaw',c:'Chilled',u:'tubs',p:3}
];
const cats=[['meat','🥩 Meat'],['fish','🐟 Fish'],['vegetables','🥬 Vegetables'],['bakery','🍞 Bakery'],['dairy','🧀 Dairy'],['dry','🧂 Dry Goods'],['frozen','🧊 Frozen'],['canned','🥫 Canned'],['herbs','🌿 Herbs'],['desserts','🍰 Desserts']];
function cat(x){const s=(x.n+' '+x.c).toLowerCase();if(/salmon|sea bass|prawn|scampi|tuna|fish|cod/.test(s))return'fish';if(/chicken|bacon|sausage|ham|minced beef|steak|rib-eye|lamb|turkey/.test(s))return'meat';if(/bread|toast|muffin|baguette|panini|sourdough|bun|pitta|pancake|pastry|crouton/.test(s))return'bakery';if(/egg|milk|cream|halloumi|feta|mozzarella|cheddar|parmesan|butter|coleslaw/.test(s))return'dairy';if(/hash brown|chips|fries|nugget|falafel/.test(s)||x.c.toLowerCase().includes('frozen'))return'frozen';if(/bean|tuna|sweetcorn|olive|sun-dried|kidney|piccalilli/.test(s)||/tins|jars/.test(x.c.toLowerCase()))return'canned';if(/herb|basil|parsley|coriander|mint|spice/.test(s))return'herbs';if(/jam|maple|cinnamon|sugar|dessert|cake|chocolate/.test(s))return'desserts';if(/avocado|tomato|cucumber|salad|rocket|spinach|mushroom|fruit|lettuce|pepper|onion|potato|vegetable|lemon/.test(s))return'vegetables';return'dry'}inventory.forEach(x=>x.tag=cat(x));
const key='paradeInventoryV2';let state=JSON.parse(localStorage.getItem(key)||localStorage.getItem('paradeInventoryFrequencyV1')||'{}');state.items=state.items||{};let view='all',tag='all';const day=new Date().toISOString().slice(0,10);if(state.day!==day){state.day=day;Object.values(state.items).forEach(x=>Object.assign(x,{checked:false,reorder:false,stock:'',order:''}))}
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function st(i){return Object.assign({checked:false,reorder:false,stock:'',order:'',orderFrequency:0,lastOrdered:''},state.items[i]||{})}function save(){localStorage.setItem(key,JSON.stringify(state));summary()}function sorted(){return inventory.map((x,i)=>({...x,i,cnt:+st(i).orderFrequency||0})).sort((a,b)=>b.cnt-a.cnt||a.n.localeCompare(b.n))}
function renderTags(){tags.innerHTML='<button class="tagfilter '+(tag==='all'?'active':'')+'" data-tag="all">All tags</button>'+cats.map(c=>`<button class="tagfilter ${tag===c[0]?'active':''}" data-tag="${c[0]}">${c[1]}</button>`).join('');tags.querySelectorAll('button').forEach(b=>b.onclick=()=>{tag=b.dataset.tag;renderTags();filter()})}
function card(x){const s=st(x.i),label=cats.find(c=>c[0]===x.tag)[1],last=s.lastOrdered?new Date(s.lastOrdered).toLocaleDateString('en-GB'):'Never';return `<article class="card ${s.checked?'checked':''} ${s.reorder?'reorder':''}" data-i="${x.i}" data-tag="${x.tag}" data-search="${esc((x.n+' '+label).toLowerCase())}"><div class="line"><input class="check" type="checkbox" ${s.checked?'checked':''}><div class="item"><div class="name">${esc(x.n)}</div><span class="tag">${label}</span></div><span class="count">⭐ ${s.orderFrequency||0}×</span></div><div class="details"><div class="field"><label>Current stock</label><input class="stock" value="${esc(s.stock)}" placeholder="0 ${esc(x.u)}"></div><div class="field"><label>Order quantity</label><input class="qty" value="${esc(s.order)}" placeholder="Par ${x.p} ${esc(x.u)}"></div></div><button class="orderBtn">＋ Add order</button><div class="status"><label><input class="re" type="checkbox" ${s.reorder?'checked':''}> Needs reorder</label><span class="saved">Last: ${last} · Par: ${x.p} ${esc(x.u)}</span></div></article>`}
function render(){const a=sorted();top.innerHTML=a.slice(0,10).map((x,i)=>`<article class="top-card"><small>#${i+1}</small><b>${esc(x.n)}</b><span>⭐ ${x.cnt} order${x.cnt===1?'':'s'}</span></article>`).join('');app.innerHTML=cats.map(c=>{const arr=a.filter(x=>x.tag===c[0]);return `<section class="section catsec" data-sec="${c[0]}"><div class="head"><div><h2>${c[1]}</h2><div class="meta">${arr.length} ingredients</div></div><div class="meta shown"></div></div><div class="grid">${arr.map(card).join('')}</div></section>`}).join('');bind();renderTags();filter();summary()}
function bind(){document.querySelectorAll('.card').forEach(c=>{const i=c.dataset.i,g=()=>state.items[i]=st(i);c.querySelector('.check').onchange=e=>{g().checked=e.target.checked;save();render()};c.querySelector('.re').onchange=e=>{g().reorder=e.target.checked;save();render()};c.querySelector('.stock').oninput=e=>{g().stock=e.target.value;save()};c.querySelector('.qty').oninput=e=>{g().order=e.target.value;save()};c.querySelector('.orderBtn').onclick=()=>{const s=g();s.orderFrequency=(+s.orderFrequency||0)+1;s.lastOrdered=new Date().toISOString();s.reorder=false;save();render()}})}
function filter(){const q=search.value.toLowerCase().trim();let n=0;document.querySelectorAll('.card').forEach(c=>{const s=st(c.dataset.i),show=(!q||c.dataset.search.includes(q))&&(tag==='all'||c.dataset.tag===tag)&&(view==='all'||view==='reorder'&&s.reorder||view==='unchecked'&&!s.checked);c.style.display=show?'':'none';if(show)n++});document.querySelectorAll('.catsec').forEach(s=>{const m=[...s.querySelectorAll('.card')].filter(c=>c.style.display!=='none').length;s.style.display=m?'':'none';s.querySelector('.shown').textContent=m+' item'+(m===1?'':'s')});topSec.style.display=(q||tag!=='all'||view!=='all')?'none':'';empty.style.display=n?'none':'block'}function summary(){const a=inventory.map((_,i)=>st(i));total.textContent=a.length;checked.textContent=a.filter(x=>x.checked).length;need.textContent=a.filter(x=>x.reorder).length;progress.textContent=Math.round(a.filter(x=>x.checked).length/a.length*100)+'%';orders.textContent=a.reduce((n,x)=>n+(+x.orderFrequency||0),0)}
search.oninput=filter;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;filter()});document.getElementById('print').onclick=()=>print();document.getElementById('reset').onclick=()=>{if(confirm('Clear today’s checks, stock and reorder marks? Order counts will stay.')){Object.keys(state.items).forEach(i=>Object.assign(state.items[i],{checked:false,reorder:false,stock:'',order:''}));save();render()}};document.getElementById('csv').onclick=()=>{const rows=[['Ingredient','Tag','Unit','Par','Stock','Order qty','Checked','Needs reorder','Lifetime orders','Last ordered']];sorted().forEach(x=>{const s=st(x.i);rows.push([x.n,cats.find(c=>c[0]===x.tag)[1],x.u,x.p,s.stock,s.order,s.checked?'Yes':'No',s.reorder?'Yes':'No',s.orderFrequency||0,s.lastOrdered||''])});const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='parade-reorder-'+day+'.csv';a.click()};render();
</script></body></html>
